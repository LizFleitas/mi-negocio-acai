<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Negocio Açai</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#35263e;background:#faf7fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#54266f;color:white;padding:24px 16px;flex-shrink:0}.brand{font-size:22px;font-weight:800;padding:6px 12px 30px}.nav{display:block;width:100%;text-align:left;background:transparent;color:#f3e5f7;border-radius:12px;padding:13px 15px;margin-bottom:5px}.nav.active,.nav:hover{background:#75418e}.main{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 18px}.muted{color:#82758b;font-size:13px}.tag{background:#eee1f4;color:#63327a;padding:8px 12px;border-radius:20px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin-bottom:24px}.card,.panel{background:white;border:1px solid #eee6f2;border-radius:16px;padding:20px;box-shadow:0 4px 18px #50236608}.value{font-size:27px;font-weight:800;color:#62317d;margin:10px 0 2px}.panel{margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.field input,.field select{padding:11px;border:1px solid #ded2e6;border-radius:9px;background:white;min-width:0}.primary{background:#693785;color:white;border-radius:10px;padding:12px 17px;margin-top:16px;font-weight:700}.primary:hover{background:#51236d}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 9px;text-align:left;border-bottom:1px solid #eee7f1}th{color:#796884;font-size:12px} .scroll{overflow:auto}.note{background:#f4ebf8;padding:13px;border-radius:10px;font-size:13px;color:#674477;margin-bottom:20px}.hidden{display:none}.danger{color:#a3334d}.smallbtn{background:#f1e7f5;border-radius:7px;padding:7px 10px;color:#663780} @media(max-width:750px){.app{display:block}.sidebar{width:100%;padding:12px}.brand{padding:8px}.menu{display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto;padding:10px}.main{padding:16px}h1{font-size:22px}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand">🫐 Mi Negocio Açai</div><nav class="menu" id="menu"></nav></aside><main class="main"><div class="top"><div><h1 id="title">Inicio</h1><div class="muted">Organizá tu emprendimiento en un solo lugar 💜</div></div><span class="tag">Versión de prueba · Local</span></div><div class="note">Esta versión guarda los registros solamente en este navegador. No ingreses información sensible ni la uses todavía como sistema definitivo.</div><div id="content"></div></main></div>
<script>
const products=[{name:'Açai tradicional 300 ml',price:15000},{name:'Açai tradicional 400 ml',price:20000},{name:'Helado frutal',price:2500},{name:'Geladinho',price:1000}];
const sections=['Inicio','Ventas','Gastos','Inventario','Clientes','Reportes'];
const key='mi_negocio_acai_demo_v1';
let db;try{db=JSON.parse(localStorage.getItem(key))||{sales:[],expenses:[],stock:{},clients:[]}}catch{db={sales:[],expenses:[],stock:{},clients:[]}}
function save(){localStorage.setItem(key,JSON.stringify(db))}function money(n){return 'G. '+Number(n||0).toLocaleString('es-PY')}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toLocaleDateString('es-PY')}function sum(a,fn){return a.reduce((n,x)=>n+fn(x),0)}function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="muted">Todavía no hay registros</td></tr>`}</tbody></table></div>`}function card(label,value){return `<div class="card"><div class="muted">${label}</div><div class="value">${value}</div></div>`}
let page='Inicio';function go(p){page=p;document.getElementById('title').textContent=p;document.getElementById('menu').innerHTML=sections.map(s=>`<button class="nav ${s===p?'active':''}" onclick="go('${s}')">${({Inicio:'⌂',Ventas:'🛍',Gastos:'↗',Inventario:'▣',Clientes:'♙',Reportes:'▤'})[s]} ${s}</button>`).join('');render()}
function render(){const el=document.getElementById('content');const revenue=sum(db.sales,x=>x.price*x.qty),expenses=sum(db.expenses,x=>x.amount),received=sum(db.sales.filter(x=>x.payment!=='Pendiente'),x=>x.price*x.qty),pending=revenue-received;let html='';
if(page==='Inicio')html=`<div class="cards">${card('Ventas registradas',money(revenue))}${card('Cobrado',money(received))}${card('Pendiente de cobro',money(pending))}${card('Gastos',money(expenses))}</div>`+panel('Últimas ventas',table(['Fecha','Producto','Cantidad','Total','Estado'],db.sales.slice(-6).reverse().map(x=>[safe(x.date),safe(x.product),x.qty,money(x.price*x.qty),safe(x.payment)])));
if(page==='Ventas')html=panel('Registrar venta',`<form onsubmit="addSale(event)"><div class="grid"><label class="field">Producto<select name="product" required>${products.map((p,i)=>`<option value="${i}">${p.name} · ${money(p.price)}</option>`).join('')}</select></label><label class="field">Cantidad<input name="qty" type="number" min="1" value="1" required></label><label class="field">Cliente (opcional)<input name="client" placeholder="Nombre del cliente"></label><label class="field">Forma de pago<select name="payment"><option>Efectivo</option><option>Transferencia</option><option>Pendiente</option></select></label></div><button class="primary">Guardar venta</button></form>`)+panel('Historial de ventas',table(['Fecha','Producto','Cliente','Cantidad','Total','Pago'],db.sales.slice().reverse().map(x=>[safe(x.date),safe(x.product),safe(x.client||'—'),x.qty,money(x.price*x.qty),safe(x.payment)])));
if(page==='Gastos')html=panel('Registrar gasto',`<form onsubmit="addExpense(event)"><div class="grid"><label class="field">Concepto<input name="concept" required placeholder="Ej.: compra de insumos"></label><label class="field">Monto (Gs.)<input name="amount" type="number" min="1" required></label></div><button class="primary">Guardar gasto</button></form>`)+panel('Gastos registrados',table(['Fecha','Concepto','Monto'],db.expenses.slice().reverse().map(x=>[safe(x.date),safe(x.concept),money(x.amount)])));
if(page==='Inventario')html=panel('Agregar productos terminados',`<form onsubmit="addStock(event)"><div class="grid"><label class="field">Producto<select name="product">${products.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('')}</select></label><label class="field">Cantidad producida<input name="qty" type="number" min="1" required></label></div><button class="primary">Agregar al inventario</button></form>`)+panel('Existencias',table(['Producto','Unidades disponibles'],products.map(p=>[safe(p.name),db.stock[p.name]||0])));
if(page==='Clientes')html=panel('Agregar cliente',`<form onsubmit="addClient(event)"><div class="grid"><label class="field">Nombre<input name="name" required></label><label class="field">Teléfono (opcional)<input name="phone" placeholder="09..."></label></div><button class="primary">Guardar cliente</button></form>`)+panel('Clientes registrados',table(['Nombre','Teléfono'],db.clients.map(x=>[safe(x.name),safe(x.phone||'—')])));
if(page==='Reportes')html=`<div class="cards">${card('Total vendido',money(revenue))}${card('Total cobrado',money(received))}${card('Cuentas pendientes',money(pending))}${card('Gastos registrados',money(expenses))}</div>`+panel('Resumen',`<p>Ingresos cobrados menos gastos registrados: <strong>${money(received-expenses)}</strong></p><p class="muted">Esto NO es la ganancia real: faltan costos de producción, inventario inicial y otros ajustes.</p><button class="primary" onclick="exportCSV()">Exportar ventas (CSV para Excel)</button>`);
el.innerHTML=html}
function addSale(e){e.preventDefault();const f=new FormData(e.target),p=products[Number(f.get('product'))],qty=Number(f.get('qty'));if(!p||qty<1)return alert('Revisá la cantidad');if((db.stock[p.name]||0)<qty)return alert('No hay suficiente inventario. Primero agregá la producción en Inventario.');db.stock[p.name]-=qty;db.sales.push({date:today(),product:p.name,price:p.price,qty,client:String(f.get('client')||'').trim(),payment:f.get('payment')});save();render();alert('Venta guardada en este navegador')}
function addExpense(e){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return;db.expenses.push({date:today(),concept:String(f.get('concept')).trim(),amount});save();render()}
function addStock(e){e.preventDefault();const f=new FormData(e.target),p=products[Number(f.get('product'))],qty=Number(f.get('qty'));if(!p||qty<1)return;db.stock[p.name]=(db.stock[p.name]||0)+qty;save();render()}
function addClient(e){e.preventDefault();const f=new FormData(e.target);db.clients.push({name:String(f.get('name')).trim(),phone:String(f.get('phone')).trim()});save();render()}
function exportCSV(){const rows=[['Fecha','Producto','Cliente','Cantidad','Precio unitario','Total','Pago'],...db.sales.map(x=>[x.date,x.product,x.client,x.qty,x.price,x.price*x.qty,x.payment])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ventas-acai.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
go('Inicio');
</script></body></html>
